[build-system]
requires = ["setuptools>=82.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radpattern"
version = "0.1.0"
description = "Simulation and analytical tools for radiation and scattering patterns"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
  { name = "Radek" }
]
dependencies = [
  "numpy==2.4.4",
  "matplotlib==3.10.9",
  "cupy-cuda11x==13.6.0",
  "joblib==1.5.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

